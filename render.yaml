# Render Blueprint: a PostgreSQL database and one web service that serves the API and the React app.
# Dashboard: New > Blueprint > pick this repository. Free plans, no card needed.
# The daily Backblaze B2 backup job is in docs/render-backup-job.yaml. Add it after the first deploy.
databases:
  - name: agricoopledger-db
    plan: free
    databaseName: agricoopledger
    user: agri
    postgresMajorVersion: "16"   # the backup image uses the version 16 client, so keep these equal

services:
  - type: web
    name: agricoopledger
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agricoopledger-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: SEED_DEMO
        value: "true"

# To keep the free web service awake before a demonstration, use a free external pinger such as
# cron-job.org: GET https://<your-service>.onrender.com/api/health every 10 minutes.
